<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Business Intelligence — Login</title>
  <style>
   * { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #111; border: 0.5px solid #1f1f1f; border-radius: 20px; padding: 44px; width: 100%; max-width: 400px; box-shadow: 0 0 40px #4ade8008; }
h1 { font-size: 22px; font-weight: 500; color: #fff; }
.subtitle { font-size: 13px; color: #555; margin-bottom: 28px; margin-top: 4px; }
label { font-size: 12px; color: #666; display: block; margin-bottom: 6px; }
input { width: 100%; background: #0f0f0f; border: 0.5px solid #2a2a2a; border-radius: 10px; color: #fff; font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 14px; transition: border 0.2s; }
input:focus { border-color: #4ade80; }
.btn { width: 100%; background: #4ade80; color: #000; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; padding: 12px; cursor: pointer; margin-bottom: 12px; transition: background 0.2s; }
.btn:hover { background: #22c55e; }
.btn-secondary { width: 100%; background: transparent; color: #555; border: 0.5px solid #222; border-radius: 10px; font-size: 14px; padding: 12px; cursor: pointer; transition: all 0.2s; }
.btn-secondary:hover { background: #1a1a1a; color: #fff; }
.msg { font-size: 12px; text-align: center; margin-top: 12px; min-height: 18px; }
.msg.error { color: #f87171; }
.msg.success { color: #4ade80; }
.tabs { display: flex; gap: 6px; margin-bottom: 24px; background: #0f0f0f; padding: 4px; border-radius: 10px; border: 0.5px solid #1f1f1f; }
.tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #555; transition: all 0.2s; }
.tab.active { background: #1a1a1a; color: #fff; border: 0.5px solid #2a2a2a; }
  </style>
</head>
<body>
<div class="card">
  <h1>Alpha Business Intelligence</h1>
  <p class="subtitle">Accede a tu dashboard empresarial</p>

  <div class="tabs">
    <div class="tab active" onclick="setTab('login')">Iniciar sesión</div>
    <div class="tab" onclick="setTab('registro')">Registrarse</div>
  </div>

  <div id="form-login">
    <label>Usuario</label>
    <input id="login-user" type="text" placeholder="Tu usuario" />
    <label>Contraseña</label>
    <input id="login-pass" type="password" placeholder="Tu contraseña" />
    <button class="btn" onclick="iniciarSesion()">Entrar</button>
  </div>

  <div id="form-registro" style="display:none">
    <label>Usuario</label>
    <input id="reg-user" type="text" placeholder="Elige un usuario" />
    <label>Contraseña</label>
    <input id="reg-pass" type="password" placeholder="Elige una contraseña" />
    <button class="btn" onclick="registrarse()">Crear cuenta</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  const API = 'https://alpha-business-intelligence.onrender.com'

  function setTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'registro' && i === 1))
    })
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none'
    document.getElementById('form-registro').style.display = tab === 'registro' ? 'block' : 'none'
    document.getElementById('msg').textContent = ''
  }

  async function iniciarSesion() {
    const usuario = document.getElementById('login-user').value
    const password = document.getElementById('login-pass').value
    const msg = document.getElementById('msg')

    if (!usuario || !password) {
      msg.textContent = 'Completa todos los campos'
      msg.className = 'msg error'
      return
    }

    try {
      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ usuario, password })
      })
      const data = await res.json()
      if (res.ok) {
        msg.textContent = '✓ Entrando...'
        msg.className = 'msg success'
        localStorage.setItem('usuario', data.usuario)
        setTimeout(() => window.location.href = 'index.html', 1000)
      } else {
        msg.textContent = data.error
        msg.className = 'msg error'
      }
    } catch (e) {
      msg.textContent = 'Error de conexión'
      msg.className = 'msg error'
    }
  }

  async function registrarse() {
    const usuario = document.getElementById('reg-user').value
    const password = document.getElementById('reg-pass').value
    const msg = document.getElementById('msg')

    if (!usuario || !password) {
      msg.textContent = 'Completa todos los campos'
      msg.className = 'msg error'
      return
    }

    try {
      const res = await fetch(`${API}/registro`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      })
      const data = await res.json()
      if (res.ok) {
        msg.textContent = '✓ Cuenta creada, inicia sesión'
        msg.className = 'msg success'
        setTimeout(() => setTab('login'), 1500)
      } else {
        msg.textContent = data.error
        msg.className = 'msg error'
      }
    } catch (e) {
      msg.textContent = 'Error de conexión'
      msg.className = 'msg error'
    }
  }
</script>
</body>
</html>
